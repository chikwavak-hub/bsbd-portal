[build]
  base      = "bsbd-portal 3"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Map a clean API path to the function (this source path IS allowed)
[[redirects]]
  from   = "/api/ai-email"
  to     = "/.netlify/functions/ai-email"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/ai-query"
  to     = "/.netlify/functions/ai-query"
  status = 200
  force  = true

# SPA catch-all
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
