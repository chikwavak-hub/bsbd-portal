[build]
  base      = "bsbd-portal 3"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA catch-all. force = false means real files and functions
# are served first; only unmatched routes fall through to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
