[build]
  base      = "bsbd-portal 3"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Functions must be excluded from the SPA catch-all — this rule comes FIRST
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA catch-all comes AFTER so it doesn't swallow function calls
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
